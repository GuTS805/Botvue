<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Botvue — social card source</title>
<!--
  Source for apps/web/og.png, rendered at exactly 1200x630.

  It is kept in the repo rather than only shipping the PNG because the card
  states measured facts — 161 bytes, 14 properties — and an image carrying
  numbers with no way to regenerate it is the kind of unverifiable artifact
  this project spends the rest of its time arguing against.

  Regenerate:
    python -m uvicorn scanner.gateway:app --port 8000
    open /og-card.html at a 1200x630 viewport and screenshot it to apps/web/og.png
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#eef0ed;
  --ground-2:#e3e7e3;
  --surface:#fafbfa;
  --ink:#0d1412;
  --ink-2:#525d58;
  --rule:#cfd7d1;
  --rule-2:#dee4df;
  --received:#16644f;
  --lie:#bd1f3c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  font-family:"Instrument Sans",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(900px 520px at 88% -12%, rgba(22,100,79,.16), transparent 62%),
    radial-gradient(700px 420px at -4% 8%, rgba(63,92,138,.09), transparent 60%),
    var(--ground);
}

/* Everything lives inside this box. Platforms crop toward the centre, and the
   crimson status chip is the one element that must survive every crop. */
.safe{position:absolute;inset:54px 64px;display:flex;flex-direction:column}

.brand{display:flex;align-items:center;gap:13px}
.brand b{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:31px;letter-spacing:-.04em}
.brand span{font-size:20px;color:var(--ink-2)}

h1{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:52px;line-height:1.05;
  letter-spacing:-.042em;margin-top:26px;max-width:22ch}
h1 .accent{color:var(--received)}

.exhibit{margin-top:auto;border:1px solid var(--rule);background:var(--surface);
  border-radius:16px;overflow:hidden;
  box-shadow:0 2px 4px rgba(13,20,18,.04), 0 24px 60px -30px rgba(13,20,18,.3)}
.bar{display:flex;align-items:center;gap:16px;padding:14px 26px;
  border-bottom:1px solid var(--rule);background:var(--ground-2)}
.chip{font-family:"JetBrains Mono",monospace;font-size:19px;font-weight:700;
  letter-spacing:.02em;padding:5px 13px;color:#fff;background:var(--lie);border-radius:6px}
.req{font-family:"JetBrains Mono",monospace;font-size:18px;color:var(--ink-2)}
.body{padding:30px 26px 28px}
.body q{display:block;quotes:none;font-family:"JetBrains Mono",monospace;
  font-size:29px;line-height:1.46;letter-spacing:-.012em}
.foot{display:flex;gap:34px;padding:16px 26px;border-top:1px solid var(--rule-2);
  font-size:19px;color:var(--ink-2)}
.foot b{font-weight:600;color:var(--ink)}
.foot .m{font-family:"JetBrains Mono",monospace;font-size:18px}
</style>
</head>
<body>
<div class="safe">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" fill="#0d1412"/>
      <rect x="6" y="9" width="9" height="14" fill="#16644f"/>
      <rect x="18" y="9" width="9" height="14" fill="none" stroke="#bd1f3c" stroke-width="1.5"/>
    </svg>
    <b>Botvue</b><span>see what the bots see</span>
  </div>

  <h1>A refusal, delivered as a <span class="accent">success</span>.</h1>

  <div class="exhibit">
    <div class="bar">
      <span class="chip">200 OK</span>
      <span class="req">GET / &nbsp;·&nbsp; User-Agent: GPTBot/1.1</span>
    </div>
    <div class="body">
      <q>You are not authorized to access this content without a valid TollBit Token.</q>
    </div>
    <!-- 64 properties send these exact bytes; 14 of them send it as 200. The card
         travels without the page around it, so it says which number this is. -->
    <div class="foot">
      <span><b>161</b> bytes, entire body</span>
      <span>answered <b>200</b> by <b>14</b> properties</span>
      <span class="m">sha256 ad3a87823990…</span>
    </div>
  </div>
</div>
</body>
</html>
