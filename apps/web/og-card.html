<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Botvue — social card source</title>
<!--
  Source for apps/web/og.png, rendered at exactly 1200x630.

  It is kept in the repo rather than only shipping the PNG because the card
  states measured facts — 161 bytes, 14 properties — and an image carrying
  numbers with no way to regenerate it is the kind of unverifiable artifact
  this project spends the rest of its time arguing against.

  Regenerate:
    python -m uvicorn scanner.gateway:app --port 8000
    open /og-card.html at a 1200x630 viewport and screenshot it to apps/web/og.png
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#06080e;
  --ground-2:rgba(0,0,0,.3);
  --surface:#0e1420;
  --ink:#e9eef8;
  --ink-2:#9aa7bf;
  --ink-3:#66738c;
  --rule:rgba(150,175,225,.13);
  --rule-2:rgba(150,175,225,.07);
  --received:#3ddc97;
  --lie:#ff4d6a;
  --accent:#6cc6ff;
  --violet:#8b7bf0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  font-family:Inter,system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(900px 560px at 86% -14%, rgba(90,162,255,.26), transparent 64%),
    radial-gradient(720px 460px at -6% 10%, rgba(139,123,240,.20), transparent 62%),
    var(--ground);
}
/* The same fine grid the site stands on, so a shared card and the page it
   links to read as one product. */
body::before{content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(to right, rgba(150,175,225,.055) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(150,175,225,.055) 1px, transparent 1px);
  background-size:52px 52px;
  -webkit-mask-image:radial-gradient(120% 80% at 50% 0%, #000 6%, transparent 70%);
  mask-image:radial-gradient(120% 80% at 50% 0%, #000 6%, transparent 70%)}

/* Everything lives inside this box. Platforms crop toward the centre, and the
   crimson status chip is the one element that must survive every crop. */
.safe{position:absolute;inset:54px 64px;display:flex;flex-direction:column;z-index:1}

.brand{display:flex;align-items:center;gap:13px}
.brand b{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:31px;letter-spacing:-.04em;color:#fff}
.brand span{font-size:20px;color:var(--ink-3)}

h1{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:54px;line-height:1.04;
  letter-spacing:-.05em;margin-top:26px;max-width:22ch;color:#fff}
h1 .accent{background:linear-gradient(176deg, var(--accent), var(--violet));
  -webkit-background-clip:text;background-clip:text;color:transparent}

.exhibit{margin-top:auto;border:1px solid var(--rule);border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg, #121a29, #0e1420);
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 40px 90px -40px rgba(0,0,0,1)}
.bar{display:flex;align-items:center;gap:16px;padding:14px 26px;
  border-bottom:1px solid var(--rule);background:var(--ground-2)}
.chip{font-family:"JetBrains Mono",monospace;font-size:19px;font-weight:700;
  letter-spacing:.03em;padding:5px 13px;border-radius:7px;color:var(--lie);
  background:rgba(255,77,106,.12);box-shadow:inset 0 0 0 1px rgba(255,77,106,.34)}
.req{font-family:"JetBrains Mono",monospace;font-size:18px;color:var(--ink-3)}
.body{padding:30px 26px 28px}
.body q{display:block;quotes:none;font-family:"JetBrains Mono",monospace;
  font-size:29px;line-height:1.46;letter-spacing:-.015em;color:#fff}
.foot{display:flex;gap:34px;padding:16px 26px;border-top:1px solid var(--rule-2);
  font-size:19px;color:var(--ink-3);background:rgba(0,0,0,.24)}
.foot b{font-weight:600;color:var(--ink)}
.foot .m{font-family:"JetBrains Mono",monospace;font-size:18px}
</style>
</head>
<body>
<div class="safe">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="7" fill="#0e1420"/>
      <rect width="32" height="32" rx="7" fill="none" stroke="rgba(150,175,225,.25)"/>
      <rect x="6" y="9" width="9" height="14" rx="2" fill="#3ddc97"/>
      <rect x="18" y="9" width="9" height="14" rx="2" fill="none" stroke="#ff4d6a" stroke-width="1.6"/>
    </svg>
    <b>Botvue</b><span>see what the bots see</span>
  </div>

  <h1>A refusal, delivered as a <span class="accent">success</span>.</h1>

  <div class="exhibit">
    <div class="bar">
      <span class="chip">200 OK</span>
      <span class="req">GET / &nbsp;·&nbsp; User-Agent: GPTBot/1.1</span>
    </div>
    <div class="body">
      <q>You are not authorized to access this content without a valid TollBit Token.</q>
    </div>
    <!-- 64 properties send these exact bytes; 14 of them send it as 200. The card
         travels without the page around it, so it says which number this is. -->
    <div class="foot">
      <span><b>161</b> bytes, entire body</span>
      <span>answered <b>200</b> by <b>14</b> properties</span>
      <span class="m">sha256 ad3a87823990…</span>
    </div>
  </div>
</div>
</body>
</html>
